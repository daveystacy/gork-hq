<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><title>GORK HQ</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0b0b0f;color:#e5e5ea;font:13px ui-monospace,Menlo,monospace;display:flex;height:100vh}
#stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:10px;min-width:0}
h1{margin:0 0 8px;font-size:18px;letter-spacing:2px}h1 b{color:#8b5cf6}h1 small{color:#666;font-size:11px;margin-left:8px}
#view{width:100%;height:calc(100vh - 60px);border:1px solid #222;border-radius:12px;overflow:hidden;background:radial-gradient(#171724,#07070a);touch-action:none}#view canvas{display:block}
#side{width:340px;background:#121218;border-left:1px solid #222;overflow:auto;padding:12px}
.sec{margin-bottom:14px}.sec h2{font-size:11px;color:#888;text-transform:uppercase;margin:0 0 6px}
.ag{display:flex;gap:8px;align-items:center;background:#16161c;padding:6px;border-radius:6px;margin-bottom:4px}
.dot{width:12px;height:12px;border-radius:3px}.st{margin-left:auto;font-size:10px;padding:2px 6px;border-radius:4px;background:#222}
.working{color:#22c55e}.meeting{color:#8b5cf6}.waiting_user{color:#f59e0b}.idle{color:#777}
.bar{height:4px;background:#222;border-radius:2px;margin-top:3px}.bar i{display:block;height:100%;background:#22c55e;border-radius:2px}
.tk{background:#16161c;padding:6px;border-radius:6px;margin-bottom:4px;border-left:3px solid #555}
.tk.in-progress{border-color:#22c55e}.tk.queued{border-color:#f59e0b}.tk.done{border-color:#444;opacity:.6}
.lg{font-size:11px;padding:3px 0;border-bottom:1px solid #1d1d24}.lg span{color:#666;margin-right:6px}
@media(max-width:800px){body{flex-direction:column;height:auto}#side{width:100%;border:0}}
@media(max-width:800px){#view{height:52vh}}</style>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}</script>
</head><body>
<div id="stage"><h1><b>GORK</b> HQ<small id="upd"></small></h1><div id="view"></div></div>
<div id="side"><div class="sec"><h2>Team</h2><div id="team"></div></div>
<div class="sec"><h2>Tasks</h2><div id="tasks"></div></div><div class="sec"><h2>Activity</h2><div id="log"></div></div></div>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {RoomEnvironment} from 'three/addons/environments/RoomEnvironment.js';
const V=document.getElementById('view');
const R=new THREE.WebGLRenderer({antialias:true,alpha:true,preserveDrawingBuffer:true});R.setPixelRatio(Math.min(devicePixelRatio,2));
R.shadowMap.enabled=true;R.shadowMap.type=THREE.PCFSoftShadowMap;R.toneMapping=THREE.ACESFilmicToneMapping;R.outputColorSpace=THREE.SRGBColorSpace;V.appendChild(R.domElement);
const scene=new THREE.Scene();scene.environment=new THREE.PMREMGenerator(R).fromScene(new RoomEnvironment(),.04).texture;scene.environmentIntensity=.7;
const cam=new THREE.OrthographicCamera(-1,1,1,-1,.1,200);cam.position.set(18,17,18);
const ctl=new OrbitControls(cam,R.domElement);ctl.enableDamping=true;ctl.target.set(0,0,0);ctl.minZoom=.6;ctl.maxZoom=3;ctl.maxPolarAngle=1.25;ctl.minPolarAngle=.5;ctl.enablePan=false;ctl.autoRotate=true;ctl.autoRotateSpeed=.25;
R.domElement.addEventListener('pointerdown',()=>ctl.autoRotate=false);
function size(){const w=V.clientWidth,h=V.clientHeight,a=w/h,k=9*Math.max(1,1.45/a);cam.left=-k*a;cam.right=k*a;cam.top=k;cam.bottom=-k;cam.updateProjectionMatrix();R.setSize(w,h)}
addEventListener('resize',size);size();
scene.add(new THREE.HemisphereLight('#9aa8ff','#201810',.5));
const sun=new THREE.DirectionalLight('#fff1dd',2.2);sun.position.set(-8,16,10);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);Object.assign(sun.shadow.camera,{left:-14,right:14,top:14,bottom:-14});sun.shadow.bias=-.0005;scene.add(sun);
const M=(c,o={})=>new THREE.MeshStandardMaterial({color:c,roughness:.7,...o});
function box(w,h,d,m,x,y,z,p=scene){const b=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);b.position.set(x,y,z);b.castShadow=b.receiveShadow=true;p.add(b);return b}
// room
const W=20,D=14;
const fc=document.createElement('canvas');fc.width=fc.height=256;const fx=fc.getContext('2d');for(let i=0;i<8;i++){fx.fillStyle=i%2?'#7a5232':'#6e4a2d';fx.fillRect(0,i*32,256,32);fx.fillStyle='rgba(0,0,0,.15)';fx.fillRect(0,i*32,256,1);fx.fillRect((i*73)%256,i*32,1,32)}
const floorT=new THREE.CanvasTexture(fc);floorT.wrapS=floorT.wrapT=THREE.RepeatWrapping;floorT.repeat.set(4,3);floorT.colorSpace=THREE.SRGBColorSpace;
box(W,.3,D,M('#fff',{map:floorT,roughness:.55}),0,-.15,0);
box(W,5,.3,M('#1a1b24'),0,2.5,-D/2);box(.3,5,D,M('#16171f'),-W/2,2.5,0);
for(let i=0;i<5;i++){box(3,2.6,.05,M('#7fb4ff',{emissive:'#3a6fd8',emissiveIntensity:.9}),-7.5+i*3.8,2.8,-D/2+.18)}// windows
const tv=box(.05,1.8,3.4,M('#0a0a0a',{emissive:'#22c55e',emissiveIntensity:.25}),-W/2+.2,2.4,-2);
box(8,.02,5,M('#14532d'),3,.01,3.5);// green rug lounge
box(7,.02,4.2,M('#2b2350'),-5,.01,-3.4);// desk rug
// desks
const DESK={builder:[-7.5,-4],browser:[-4.5,-4],gork:[0,-4.6],researcher:[4.5,-4],scanner:[7.5,-4]};const mon={};
for(const id in DESK){const[x,z]=DESK[id];box(2.2,.1,1.1,M('#2a2a30',{roughness:.4}),x,1.05,z);for(const dx of[-1,1])box(.08,1,.9,M('#111'),x+dx,.5,z);
 box(.15,.4,.15,M('#111'),x,1.3,z-.3);mon[id]=box(1.3,.75,.06,M('#000',{emissive:'#222',emissiveIntensity:1}),x,1.75,z-.32);
 box(.6,.08,.6,M('#222'),x,.6,z+.95);box(.6,.6,.08,M('#222'),x,.95,z+1.25);
 const pl=new THREE.PointLight('#88f',0,3);pl.position.set(x,1.8,z);scene.add(pl);mon[id].userData.l=pl}
// sofa, table
const sof=M('#4c1d95',{roughness:.9});box(4,.5,1.2,sof,1.5,.4,5.6);box(4,.9,.35,sof,1.5,.8,6.15);box(.35,.7,1.2,sof,-.4,.6,5.6);box(.35,.7,1.2,sof,3.4,.6,5.6);
box(1.6,.35,.9,M('#8b5e3c'),1.5,.25,3.9);
// coffee
box(1.6,1,.8,M('#3a3a42'),8.4,.5,1.5);box(.6,.8,.5,M('#888',{metalness:.9,roughness:.25}),8.4,1.4,1.5);box(.12,.12,.12,M('#fff'),8.4,1.15,1.85);
// meeting table
const mt=new THREE.Mesh(new THREE.CylinderGeometry(1.6,1.6,.1,40),M('#d9d4cb',{roughness:.3}));mt.position.set(-4,1,2.5);mt.castShadow=mt.receiveShadow=true;scene.add(mt);box(.2,1,.2,M('#222'),-4,.5,2.5);
// plants
function plant(x,z){box(.6,.7,.6,M('#d8d2c8'),x,.35,z);for(let i=0;i<5;i++){const l=new THREE.Mesh(new THREE.ConeGeometry(.35,1.3,6),M('#1f8a4c'));l.position.set(x+Math.sin(i*1.3)*.2,1.2+i*.05,z+Math.cos(i*1.3)*.2);l.rotation.set(Math.sin(i)*.4,0,Math.cos(i)*.4);l.castShadow=true;scene.add(l)}}
plant(-9.2,-6.2);plant(9.2,-6.2);plant(-9.2,6.2);plant(5.5,6.3);
const MEET=[[-4,4.3],[-2.2,2.5],[-4,.7],[-5.8,2.5],[-2.7,3.8]],SPOTS=[[0,5.2],[2.5,5.2],[7.3,1.6],[7.3,2.8],[-8.5,0],[4.8,3.2],[1.5,2.6]];
// character
const chrome=new THREE.MeshStandardMaterial({color:'#f2f4f7',metalness:1,roughness:.12,envMapIntensity:3});
const hood=M('#0d0d10',{roughness:.95}),pant=M('#131316',{roughness:.9}),shoe=M('#f5f5f5',{roughness:.5});
function tex(draw,w=128,h=128){const c=document.createElement('canvas');c.width=w;c.height=h;draw(c.getContext('2d'),w,h);const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;return t}
const logoT=tex((g)=>{g.strokeStyle='#fff';g.lineWidth=10;g.beginPath();g.arc(64,64,46,0,7);g.stroke();g.font='bold 70px sans-serif';g.fillStyle='#fff';g.textAlign='center';g.fillText('e',64,86)});
const backT=tex((g)=>{const r=g.createRadialGradient(110,100,10,128,128,80);r.addColorStop(0,'#5fa8ff');r.addColorStop(1,'#123a8a');g.fillStyle=r;g.beginPath();g.arc(128,128,70,0,7);g.fill();g.fillStyle='#2f9e57';g.beginPath();g.ellipse(105,110,25,35,.4,0,7);g.fill();g.beginPath();g.ellipse(160,150,20,28,-.3,0,7);g.fill();
 g.strokeStyle='rgba(255,255,255,.8)';g.lineWidth=3;for(const s of[-1,1]){g.beginPath();for(let i=0;i<5;i++){g.moveTo(128+s*40,200);g.lineTo(128+s*(90+i*6),130+i*12)}g.stroke()}
 g.fillStyle='#fff';g.font='bold 30px sans-serif';g.textAlign='center';g.fillText('INSPIRE',128,138);g.save();g.translate(140,20);g.font='bold 26px sans-serif';[...'EXPLORE'].forEach((ch,i)=>g.fillText(ch,0,i*33+10));g.restore()},256,256);
function label(txt,col){const t=tex((g,w,h)=>{g.fillStyle='rgba(10,10,15,.85)';g.beginPath();g.roundRect(4,8,w-8,h-16,24);g.fill();g.strokeStyle=col;g.lineWidth=4;g.stroke();g.fillStyle='#fff';g.font='bold 40px ui-monospace,monospace';g.textAlign='center';g.fillText(txt,w/2,h/2+14)},256,80);
 const s=new THREE.Sprite(new THREE.SpriteMaterial({map:t,depthTest:false}));s.scale.set(2,.62,1);s.renderOrder=10;return s}
function bubbleTex(txt,p,col){txt=txt.length>28?txt.slice(0,27)+'…':txt;return tex((g,w,h)=>{g.fillStyle='#f5f5f7';g.beginPath();g.roundRect(4,4,w-8,h-24,18);g.fill();g.beginPath();g.moveTo(w/2-12,h-20);g.lineTo(w/2,h-4);g.lineTo(w/2+12,h-20);g.fill();
 g.fillStyle=col;g.font='bold 38px ui-monospace,monospace';g.textAlign='center';g.fillText(txt,w/2,p>=0?48:64);if(p>=0){g.fillStyle='#ddd';g.fillRect(30,66,w-60,12);g.fillStyle='#22c55e';g.fillRect(30,66,(w-60)*p/100,12)}},640,110)}
function makeBot(a){const col=COL[a.id]||'#aaa',G=new THREE.Group(),body=new THREE.Group();G.add(body);
 const cs=(m)=>{m.castShadow=true;return m};
 const torso=cs(new THREE.Mesh(new THREE.CylinderGeometry(.42,.5,.95,14),hood));torso.position.y=1.5;torso.scale.z=.75;body.add(torso);
 const hd=cs(new THREE.Mesh(new THREE.TorusGeometry(.26,.12,8,16),hood));hd.rotation.x=Math.PI/2;hd.position.y=2.02;body.add(hd);
 const hb=cs(new THREE.Mesh(new THREE.SphereGeometry(.34,12,10,0,Math.PI*2,0,1.6),hood));hb.position.set(0,2.1,-.12);hb.rotation.x=-.5;body.add(hb);
 const helm=cs(new THREE.Mesh(new THREE.SphereGeometry(.3,32,24),chrome));helm.scale.set(.9,1.15,1);helm.position.y=2.35;body.add(helm);
 const vis=new THREE.Mesh(new THREE.SphereGeometry(.305,32,16,-.9,1.8,1.1,.8),new THREE.MeshStandardMaterial({color:col,metalness:1,roughness:.1,transparent:true,opacity:.55,emissive:col,emissiveIntensity:.25}));vis.scale.copy(helm.scale);vis.position.copy(helm.position);vis.rotation.y=Math.PI/2;body.add(vis);
 const lg=new THREE.Mesh(new THREE.PlaneGeometry(.16,.16),new THREE.MeshBasicMaterial({map:logoT,transparent:true}));lg.position.set(.16,1.72,.38);body.add(lg);
 const bk=new THREE.Mesh(new THREE.PlaneGeometry(.62,.62),new THREE.MeshBasicMaterial({map:backT,transparent:true}));bk.position.set(0,1.55,-.385);bk.rotation.y=Math.PI;body.add(bk);
 for(const s of[-1,1]){const st=new THREE.Mesh(new THREE.CylinderGeometry(.012,.012,.3),M('#eee'));st.position.set(s*.08,1.82,.37);body.add(st)}
 const limbs={};for(const s of[-1,1]){const arm=new THREE.Group();arm.position.set(s*.52,1.88,0);const am=cs(new THREE.Mesh(new THREE.CapsuleGeometry(.13,.65,4,8),hood));am.position.y=-.4;arm.add(am);arm.rotation.z=s*.12;body.add(arm);
  const leg=new THREE.Group();leg.position.set(s*.2,1.05,0);const lm=cs(new THREE.Mesh(new THREE.CapsuleGeometry(.16,.6,4,8),pant));lm.position.y=-.42;leg.add(lm);
  const pk=new THREE.Mesh(new THREE.BoxGeometry(.06,.2,.18),pant);pk.position.set(s*.16,-.4,0);leg.add(pk);
  const sh=cs(new THREE.Mesh(new THREE.BoxGeometry(.26,.16,.44),shoe));sh.position.set(0,-.95,.08);leg.add(sh);body.add(leg);limbs[s]={arm,leg}}
 const tag=label(a.name,col);tag.position.y=3.05;G.add(tag);
 const bub=new THREE.Sprite(new THREE.SpriteMaterial({depthTest:false,transparent:true}));bub.scale.set(5,.86,1);bub.position.y=3.75;bub.renderOrder=11;bub.visible=false;G.add(bub);
 G.position.set(...(SPOTS[Object.keys(bots).length%SPOTS.length].map((v,i)=>i?v:v)));G.position.set(G.position.x,0,G.position.y);
 const sp=SPOTS[Object.keys(bots).length%SPOTS.length];G.position.set(sp[0],0,sp[1]);
 const t0=target(a);if(t0){G.position.set(t0[0],0,t0[1]);G.rotation.y=t0[2]||0}
 scene.add(G);return{G,body,limbs,bub,ph:Math.random()*6,wx:null,wait:0,key:''}}
const bots={};
window.syncBots=function(){S.agents.forEach(a=>{if(!bots[a.id])bots[a.id]=makeBot(a)})};
function target(a,b){const d=DESK[a.id];if(a.state==='working')return[d[0],d[1]+.95,Math.PI];if(a.state==='waiting_user')return[d[0]+1.3,d[1]+1.6,0];
 if(a.state==='meeting'){const i=S.agents.filter(x=>x.state==='meeting').indexOf(a);const m=MEET[i%5];return[m[0],m[1],Math.atan2(-4-m[0],2.5-m[1])]}return null}
const clock=new THREE.Clock();
function loop(){const dt=Math.min(clock.getDelta(),.05),t=clock.elapsedTime;
 const firstMeet=S.agents.find(q=>q.state==='meeting');
 S.agents.forEach(a=>{const b=bots[a.id];if(!b)return;let tg=target(a,b);
  if(!tg){if(b.wait>0)b.wait-=dt;else if(!b.wx||Math.hypot(b.wx[0]-b.G.position.x,b.wx[1]-b.G.position.z)<.1){const s=SPOTS[(Math.random()*SPOTS.length)|0];b.wx=[s[0]+Math.random()-.5,s[1]+Math.random()-.5,null];b.wait=3+Math.random()*5}tg=b.wx||[b.G.position.x,b.G.position.z,null]}
  const p=b.G.position,dx=tg[0]-p.x,dz=tg[1]-p.z,d=Math.hypot(dx,dz),mv=d>.05&&!(b.wait>0&&!target(a,b));
  if(mv){const v=Math.min(2.2*dt,d);p.x+=dx/d*v;p.z+=dz/d*v;b.ph+=dt*9;const ry=Math.atan2(dx,dz);let df=ry-b.G.rotation.y;df=Math.atan2(Math.sin(df),Math.cos(df));b.G.rotation.y+=df*Math.min(1,dt*10)}
  else if(tg[2]!=null){let df=tg[2]-b.G.rotation.y;df=Math.atan2(Math.sin(df),Math.cos(df));b.G.rotation.y+=df*Math.min(1,dt*6)}
  const sw=mv?Math.sin(b.ph)*.6:0;for(const s of[-1,1]){b.limbs[s].leg.rotation.x+=(s*sw-b.limbs[s].leg.rotation.x)*.3;b.limbs[s].arm.rotation.x+=((a.state==='working'&&!mv?-.9:-s*sw)-b.limbs[s].arm.rotation.x)*.3}
  b.body.position.y=mv?Math.abs(Math.cos(b.ph))*.06:Math.sin(t*2+b.ph)*.015;
  let txt='',pr=-1,col='#111';if(a.state==='working'&&!mv){txt=a.task||'working';pr=a.progress||0}else if(a.state==='waiting_user'){txt='waiting on you…';col='#b45309'}else if(a.state==='meeting'&&a===firstMeet&&!mv){txt=a.task||'meeting';col='#6d28d9'}
  const key=txt+pr+col;if(key!==b.key){b.key=key;b.bub.visible=!!txt;if(txt){b.bub.material.map?.dispose();b.bub.material.map=bubbleTex(txt,pr,col);b.bub.material.needsUpdate=true}}
  b.bub.position.y=4+(a.state==='meeting'?.4:0);
  const m=mon[a.id];if(m){const on=a.state==='working';m.material.emissive.set(on?COL[a.id]:'#1a1a22');m.material.emissiveIntensity=on?.7+Math.sin(t*4)*.15:1;m.userData.l.color.set(COL[a.id]);m.userData.l.intensity=on?3:0}});
 tv.material.emissiveIntensity=.25+Math.sin(t*1.5)*.1;ctl.update();R.render(scene,cam);requestAnimationFrame(loop)}
requestAnimationFrame(loop);

let S={agents:[],tasks:[],log:[]};
const COL={gork:'#8b5cf6',builder:'#f59e0b',browser:'#3b82f6',researcher:'#22c55e',scanner:'#ef4444'};
const tz={timeZone:'America/Chicago',hour:'numeric',minute:'2-digit'};
const ft=t=>t?new Date(t).toLocaleTimeString('en-US',tz)+' CT':'—';
const esc=s=>String(s??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
async function poll(){try{const r=await fetch('status.json?'+Date.now(),{cache:'no-store'});S=await r.json();render()}catch(e){}}
function render(){document.getElementById('upd').textContent='updated '+ft(S.updated);
 document.getElementById('team').innerHTML=S.agents.map(a=>`<div class="ag"><div class="dot" style="background:${COL[a.id]||'#aaa'}"></div><div style="flex:1;min-width:0"><b>${esc(a.name)}</b> <span style="color:#666">${esc(a.role)}</span><div style="font-size:11px;color:#aaa;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(a.task)||'—'}</div>${a.state==='working'?`<div class="bar"><i style="width:${a.progress}%"></i></div>`:''}</div><span class="st ${a.state}">${a.state.replace('_',' ')}</span></div>`).join('');
 const ord={'in-progress':0,queued:1,done:2};
 document.getElementById('tasks').innerHTML=[...S.tasks].sort((a,b)=>ord[a.status]-ord[b.status]).map(t=>`<div class="tk ${t.status}">${esc(t.title)}<div style="font-size:10px;color:#777">${t.status} · ${esc(t.owner)} · ${t.status==='done'?'done '+ft(t.finished):t.started?'since '+ft(t.started):'queued'}</div></div>`).join('');
 document.getElementById('log').innerHTML=[...S.log].reverse().slice(0,40).map(l=>`<div class="lg"><span>${ft(l.t)}</span>${esc(l.msg)}</div>`).join('');
 syncBots()}

poll();setInterval(poll,5000);
</script></body></html>
