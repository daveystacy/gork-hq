<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><title>GORK HQ</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0b0b0f;color:#e5e5ea;font:13px ui-monospace,Menlo,monospace;display:flex;height:100vh}
#stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:10px;min-width:0}
h1{margin:0 0 8px;font-size:18px;letter-spacing:2px}h1 b{color:#8b5cf6}h1 small{color:#666;font-size:11px;margin-left:8px}
canvas{image-rendering:pixelated;width:100%;max-width:960px;border:2px solid #222;border-radius:8px;background:#000}
#side{width:340px;background:#121218;border-left:1px solid #222;overflow:auto;padding:12px}
.sec{margin-bottom:14px}.sec h2{font-size:11px;color:#888;text-transform:uppercase;margin:0 0 6px}
.ag{display:flex;gap:8px;align-items:center;background:#16161c;padding:6px;border-radius:6px;margin-bottom:4px}
.dot{width:12px;height:12px;border-radius:3px}.st{margin-left:auto;font-size:10px;padding:2px 6px;border-radius:4px;background:#222}
.working{color:#22c55e}.meeting{color:#8b5cf6}.waiting_user{color:#f59e0b}.idle{color:#777}
.bar{height:4px;background:#222;border-radius:2px;margin-top:3px}.bar i{display:block;height:100%;background:#22c55e;border-radius:2px}
.tk{background:#16161c;padding:6px;border-radius:6px;margin-bottom:4px;border-left:3px solid #555}
.tk.in-progress{border-color:#22c55e}.tk.queued{border-color:#f59e0b}.tk.done{border-color:#444;opacity:.6}
.lg{font-size:11px;padding:3px 0;border-bottom:1px solid #1d1d24}.lg span{color:#666;margin-right:6px}
@media(max-width:800px){body{flex-direction:column;height:auto}#side{width:100%;border:0}}
</style></head><body>
<div id="stage"><h1><b>GORK</b> HQ<small id="upd"></small></h1><canvas id="c" width="320" height="200"></canvas></div>
<div id="side"><div class="sec"><h2>Team</h2><div id="team"></div></div>
<div class="sec"><h2>Tasks</h2><div id="tasks"></div></div><div class="sec"><h2>Activity</h2><div id="log"></div></div></div>
<script>
const C=document.getElementById('c'),X=C.getContext('2d');X.imageSmoothingEnabled=false;
const COL={gork:'#8b5cf6',builder:'#f59e0b',browser:'#3b82f6',researcher:'#22c55e',scanner:'#ef4444'};
const DESK={gork:[150,40],builder:[40,40],browser:[80,40],researcher:[220,40],scanner:[270,40]};
const SPOTS=[[60,160],[90,170],[250,150],[280,165],[30,120],[300,110]];// sofa/coffee
const MEET=[[150,125],[175,125],[150,150],[175,150],[162,115]];
let S={agents:[],tasks:[],log:[]},sprites={};
const tz={timeZone:'America/Chicago',hour:'numeric',minute:'2-digit'};
const ft=t=>t?new Date(t).toLocaleTimeString('en-US',tz)+' CT':'—';
const esc=s=>String(s??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
async function poll(){try{const r=await fetch('status.json?'+Date.now(),{cache:'no-store'});S=await r.json();render()}catch(e){}}
function target(a,i){const d=DESK[a.id]||[160,40];if(a.state==='working')return[d[0],d[1]+14];
 if(a.state==='meeting'){const m=S.agents.filter(x=>x.state==='meeting').indexOf(a);return MEET[m%5]}
 if(a.state==='waiting_user')return[d[0]+10,d[1]+22];return null}
function render(){document.getElementById('upd').textContent='updated '+ft(S.updated);
 document.getElementById('team').innerHTML=S.agents.map(a=>`<div class="ag"><div class="dot" style="background:${COL[a.id]||'#aaa'}"></div><div style="flex:1;min-width:0"><b>${esc(a.name)}</b> <span style="color:#666">${esc(a.role)}</span><div style="font-size:11px;color:#aaa;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(a.task)||'—'}</div>${a.state==='working'?`<div class="bar"><i style="width:${a.progress}%"></i></div>`:''}</div><span class="st ${a.state}">${a.state.replace('_',' ')}</span></div>`).join('');
 const ord={'in-progress':0,queued:1,done:2};
 document.getElementById('tasks').innerHTML=[...S.tasks].sort((a,b)=>ord[a.status]-ord[b.status]).map(t=>`<div class="tk ${t.status}">${esc(t.title)}<div style="font-size:10px;color:#777">${t.status} · ${esc(t.owner)} · ${t.status==='done'?'done '+ft(t.finished):t.started?'since '+ft(t.started):'queued'}</div></div>`).join('');
 document.getElementById('log').innerHTML=[...S.log].reverse().slice(0,40).map(l=>`<div class="lg"><span>${ft(l.t)}</span>${esc(l.msg)}</div>`).join('');
 S.agents.forEach((a,i)=>{if(!sprites[a.id])sprites[a.id]={x:160,y:180,wx:null,wait:0}})}
function px(x,y,w,h,c){X.fillStyle=c;X.fillRect(x|0,y|0,w,h)}
function room(t){px(0,0,320,200,'#2a1f17');for(let y=0;y<200;y+=8)for(let x=(y/8%2)*8;x<320;x+=16)px(x,y,8,8,'#2f2319');
 px(0,0,320,22,'#1a1a28');for(let i=0;i<8;i++){px(10+i*40,4,28,12,'#0f2740');px(12+i*40,6,24,8,(Math.sin(t/900+i)>.6)?'#3b5f9a':'#1e3a66')}
 px(130,108,64,52,'#3a2a20');px(134,112,56,44,'#6b4a2f');// meeting table
 px(15,150,70,14,'#4c1d95');px(15,142,70,8,'#5b21b6');// sofa
 px(240,140,24,20,'#444');px(244,136,16,6,'#888');px(250,132,4,4,'#fff');// coffee
 px(300,30,10,14,'#14532d');px(298,24,14,8,'#22c55e');px(5,30,10,14,'#14532d');px(3,24,14,8,'#22c55e');
 for(const id in DESK){const[x,y]=DESK[id];px(x-14,y,28,12,'#5a3d26');px(x-8,y-8,16,9,'#111');
  const a=S.agents.find(q=>q.id===id);px(x-7,y-7,14,7,a&&a.state==='working'?(Math.floor(t/300)%2?COL[id]:'#0f3'):'#222');px(x-1,y+1,2,2,'#888')}}
function step(dt,t){S.agents.forEach((a,i)=>{const s=sprites[a.id];if(!s)return;let tg=target(a,i);
 if(!tg){if(!s.wx||s.wait>0&&(s.wait-=dt)>0){} if(!s.wx||Math.hypot(s.wx[0]-s.x,s.wx[1]-s.y)<1){if(s.wait<=0){s.wx=SPOTS[(Math.random()*SPOTS.length)|0].map(v=>v+Math.random()*10-5);s.wait=3000+Math.random()*5000}}tg=s.wx}
 const dx=tg[0]-s.x,dy=tg[1]-s.y,d=Math.hypot(dx,dy),v=.03*dt;s.moving=d>1;s.back=d>1&&dy<-Math.abs(dx)*.5;if(d>1){s.x+=dx/d*Math.min(v,d);s.y+=dy/d*Math.min(v,d)}})}
function guy(s,c,t){const x=Math.round(s.x),y=Math.round(s.y),f=s.moving?Math.floor(t/140)%4:0,lg=[0,1,0,-1][f],bob=f%2?-1:0,Y=y+bob;
 px(x-5,y+9,10,2,'rgba(0,0,0,.35)');
 // legs: black cargos w/ side pockets, white sneakers
 px(x-4,Y+3,4,5+(lg>0?1:0),'#141416');px(x,Y+3,4,5+(lg<0?1:0),'#141416');px(x-4,Y+5,1,2,'#26262b');px(x+3,Y+5,1,2,'#26262b');
 px(x-5,y+8+(lg>0?1:0)-(lg<0?1:0),5,2,'#f4f4f4');px(x,y+8+(lg<0?1:0)-(lg>0?1:0),5,2,'#f4f4f4');
 // oversized hoodie
 px(x-5,Y-5,10,9,'#0c0c0e');px(x-6,Y-4,1,6+(s.moving?lg:0),'#0c0c0e');px(x+5,Y-4,1,6-(s.moving?lg:0),'#0c0c0e');px(x-4,Y-6,8,2,'#18181c');
 if(s.back){px(x-3,Y-4,6,5,'#1e5aa8');px(x-2,Y-3,2,2,'#2f9e57');px(x+1,Y-1,1,1,'#2f9e57');px(x-3,Y-2,6,1,'#fff');px(x,Y-5,1,7,'#fff');px(x-4,Y,2,1,'#bbb');px(x+2,Y,2,1,'#bbb')}
 else{px(x-1,Y-6,1,3,'#ddd');px(x+1,Y-6,1,3,'#ddd');px(x+2,Y-4,2,2,'#fff');px(x-3,Y,6,2,'#18181c')}
 // chrome helmet w/ tinted reflection
 px(x-3,Y-12,6,6,'#9aa0a8');px(x-3,Y-12,6,1,'#e8ecf0');px(x-3,Y-7,6,1,'#4a4e55');px(x+2,Y-11,1,4,'#5c616a');
 if(!s.back){px(x-2,Y-11,2,2,'#fff');px(x-1,Y-9,3,2,c)}else{px(x-2,Y-11,1,1,'#fff');px(x-2,Y-9,4,1,c)}}
function bubble(x,y,txt,col){X.font='6px monospace';txt=txt.length>28?txt.slice(0,27)+'…':txt;const w=X.measureText(txt).width+6;
 const bx=Math.max(1,Math.min(319-w,x-w/2));px(bx,y,w,10,'#f5f5f5');px(x-1,y+10,3,2,'#f5f5f5');X.fillStyle=col;X.fillText(txt,bx+3,y+7)}
function draw(t){room(t);S.agents.forEach((a,i)=>{const s=sprites[a.id];if(!s)return;const c=COL[a.id]||'#aaa',b=s.moving?Math.floor(t/150)%2:0;
 guy(s,c,t);
 X.font='5px monospace';X.fillStyle='#ddd';X.fillText(a.name,s.x-X.measureText(a.name).width/2,s.y+15);
 if(a.state==='working'&&!s.moving){bubble(s.x,s.y-24-(i%2)*12,a.task||'working','#111');px(s.x-10,s.y-12,20,2,'#333');px(s.x-10,s.y-12,20*a.progress/100,2,'#22c55e')}
 else if(a.state==='waiting_user')bubble(s.x,s.y-22,'waiting on you…','#b45309');
 else if(a.state==='meeting'&&!s.moving&&a===S.agents.find(q=>q.state==='meeting'))bubble(162,92,a.task||'meeting','#6d28d9')})}
let last=0;function loop(t){const dt=Math.min(50,t-last);last=t;step(dt,t);draw(t);requestAnimationFrame(loop)}
poll();setInterval(poll,5000);requestAnimationFrame(loop);
</script></body></html>
