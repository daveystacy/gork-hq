<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0b0b0f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Expire Offices">
<title>Expire Offices</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="brand/favicon-32.png">
<link rel="apple-touch-icon" href="brand/icon-192.png">
<style>
:root{--accent:#e8e8ee;--bg:#0b0b0f;--panel:#121218;--card:#17171d;--card2:#1d1d25;--line:#25252d;--txt:#e7e7ec;--dim:#9393a0;--faint:#6d6d79;--ok:#22c55e;--warn:#f59e0b;--bad:#ef4444;--bar:52px;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg)}
body{color:var(--txt);font:13px/1.45 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums;display:flex;flex-direction:column;height:100dvh;overflow:hidden}
a{color:inherit}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}

/* the bar: one tab reaches every office */
#bar{flex:none;height:var(--bar);display:flex;align-items:center;gap:6px;padding:0 10px;padding-top:env(safe-area-inset-top);box-sizing:content-box;background:#0d0d12;border-bottom:1px solid var(--line);position:relative;z-index:30}
#allbtn{flex:none;display:flex;align-items:center;gap:8px;height:40px;padding:0 10px 0 6px;background:none;border:1px solid transparent;border-radius:10px;color:var(--txt);font:600 13px/1 inherit;font-family:inherit;cursor:pointer;position:relative;transition:background .15s}
#allbtn:hover{background:var(--card)}
#allbtn img{width:28px;height:28px;display:block}
#allcount{min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--warn);color:#201400;font:700 11px/18px inherit;font-family:inherit;text-align:center}
#sw{flex:1;min-width:0;display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;mask-image:linear-gradient(90deg,#000 calc(100% - 18px),transparent)}
#sw::-webkit-scrollbar{display:none}
.chip{flex:none;display:flex;align-items:center;gap:7px;height:40px;padding:0 12px;border-radius:10px;color:var(--dim);text-decoration:none;font-weight:600;white-space:nowrap;transition:background .15s,color .15s}
.chip:hover{background:var(--card);color:var(--txt)}
.chip.on{background:var(--card2);color:#fff;box-shadow:inset 0 -2px 0 var(--accent)}
.chip.gork{margin-left:6px;position:relative}
.chip.gork:before{content:'';position:absolute;left:-4px;top:12px;bottom:12px;width:1px;background:var(--line)}
.dot{flex:none;width:8px;height:8px;border-radius:50%;background:#3b3b45}
.dot.working{background:var(--ok);box-shadow:0 0 8px var(--ok)}
.dot.waiting{background:var(--warn);box-shadow:0 0 8px var(--warn)}
.dot.quiet{background:none;box-shadow:inset 0 0 0 2px var(--warn)}
#snd{flex:none;height:36px;padding:0 10px;display:flex;align-items:center;gap:6px;background:none;border:1px solid var(--line);border-radius:10px;color:var(--dim);font:600 12px/1 inherit;font-family:inherit;cursor:pointer;max-width:170px;white-space:nowrap;overflow:hidden;transition:color .15s,border-color .15s}
#snd:hover,#snd.on{color:var(--txt);border-color:#3a3a45}
#snd svg{flex:none;width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* layout */
#main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 348px}
#stage{min-width:0;display:flex;flex-direction:column;padding:10px 10px 10px;gap:8px}
#hd{flex:none;display:flex;align-items:center;gap:10px 14px;flex-wrap:wrap;padding:0 4px}
#hd-t{min-width:0;flex:1 1 280px}
h1{margin:0;font-size:18px;line-height:1.2;letter-spacing:.5px;font-weight:700;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
h1 span:first-child{color:var(--accent)}
#odomain{font-size:12px;font-weight:500;color:var(--dim);text-decoration:none;letter-spacing:0}
#odomain:hover{color:var(--txt);text-decoration:underline}
#focus{margin:2px 0 0;color:var(--dim);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#focus.set{color:var(--txt)}
#acts{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:36px;padding:0 13px;border-radius:9px;border:1px solid #33333d;background:var(--card);color:var(--txt);font:600 12px/1 inherit;font-family:inherit;text-decoration:none;white-space:nowrap;cursor:pointer;transition:background .15s,border-color .15s}
.btn:hover{background:var(--card2);border-color:#44444f}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#0a0a0d}
.btn.pri:hover{filter:brightness(1.08)}
.btn:active{transform:translateY(1px)}
#nochat{color:var(--faint);font-size:12px}
.conn{display:inline-flex;align-items:center;gap:6px;font-size:11px;color:var(--faint);white-space:nowrap}
.conn:before{content:'';width:7px;height:7px;border-radius:50%;background:#3b3b45}
.conn.live{color:var(--dim)}.conn.live:before{background:var(--ok);box-shadow:0 0 6px var(--ok)}
.conn.poll:before{background:var(--warn)}
.conn.off{color:var(--warn)}.conn.off:before{background:var(--bad)}

#view{flex:1;min-height:0;position:relative;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:radial-gradient(#171724,#07070a);touch-action:none}
#view canvas{display:block}
#ov{position:absolute;inset:0;z-index:5;pointer-events:none;overflow:hidden}
.bot{position:absolute;left:0;top:0;display:flex;flex-direction:column;align-items:center;gap:4px;will-change:transform}
.nt{font:700 13px ui-monospace,Menlo,monospace;color:#fff;background:rgba(10,10,15,.86);border:2px solid var(--c);border-radius:8px;padding:2px 8px;white-space:nowrap}
.bb{display:none;font:700 13px ui-monospace,Menlo,monospace;background:#f5f5f7;border-radius:10px;padding:5px 9px;max-width:min(46vw,280px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;box-shadow:0 4px 14px rgba(0,0,0,.5)}
.bb i{display:block;height:5px;background:#ddd;border-radius:3px;margin-top:4px}
.bb i b{display:block;height:100%;background:#22c55e;border-radius:3px;transition:width .4s}
#hud{position:absolute;left:8px;top:8px;z-index:6;background:rgba(0,0,0,.76);border:1px solid var(--accent);border-radius:10px;padding:6px 10px;font-weight:700;color:#fff;pointer-events:none;max-width:calc(100% - 16px)}
#hud .ok{color:var(--ok)}#hud .warn{color:var(--warn)}#hud .dimw{color:#c9a15a}
#cls{position:absolute;right:8px;top:8px;z-index:7;height:36px;padding:0 12px;font:700 13px ui-monospace,monospace;background:var(--accent);color:#0a0a0d;border:0;border-radius:8px;cursor:pointer}
#hint{position:absolute;right:10px;bottom:40px;z-index:6;color:#8a8a96;font-size:12px;pointer-events:none}
#tick{position:absolute;left:0;right:0;bottom:0;z-index:6;background:rgba(0,0,0,.82);color:var(--accent);font-weight:700;white-space:nowrap;overflow:hidden;padding:6px 0;border-top:1px solid var(--accent);pointer-events:none}
#tick span{display:inline-block;padding-left:100%;animation:tk 60s linear infinite}
#tick span.still{padding-left:12px;animation:none}
@keyframes tk{to{transform:translateX(-100%)}}
#no3d{position:absolute;inset:0;display:grid;place-items:center;padding:20px;text-align:center;color:var(--dim)}

/* the panels */
#side{min-height:0;overflow:auto;background:var(--panel);border-left:1px solid var(--line);padding:12px;overscroll-behavior:contain}
.sec{margin-bottom:16px}
.sec h2{display:flex;justify-content:space-between;font-size:11px;font-weight:600;letter-spacing:.06em;color:#888894;text-transform:uppercase;margin:0 0 6px}
.sec h2 small{font-size:11px;letter-spacing:0;text-transform:none;color:var(--faint);font-weight:500}
.ag{width:100%;display:flex;gap:9px;align-items:flex-start;text-align:left;background:var(--card);border:1px solid transparent;color:inherit;font:inherit;padding:8px;border-radius:8px;margin:0 0 4px;cursor:pointer;transition:border-color .15s,background .15s}
.ag:hover{background:var(--card2);border-color:#30303a}
.sw{flex:none;width:12px;height:12px;margin-top:3px;border-radius:3px}
.ag-m{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.ag-l{display:flex;justify-content:space-between;align-items:center;gap:8px;min-width:0}
.ag-l.sub{align-items:baseline}
.ag-l em{font-style:normal;color:var(--faint);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.ag-l small{flex:none;font-size:10.5px;color:var(--faint);white-space:nowrap}
.ag-t{font-size:12px;color:#c2c2cb;overflow-wrap:anywhere}
.bar{display:block;height:4px;background:#26262f;border-radius:2px;overflow:hidden}
.bar b{display:block;height:100%;border-radius:2px;transition:width .4s}
.st{display:inline-block;font-size:11px;padding:2px 6px;border-radius:5px;background:#24242c;color:var(--dim);white-space:nowrap}
.st.working{color:var(--ok);background:rgba(34,197,94,.12)}
.st.waiting{color:var(--warn);background:rgba(245,158,11,.14)}
.st.quiet{color:#c9a15a;background:rgba(201,161,90,.12)}
.st.meeting{color:#a78bfa;background:rgba(167,139,250,.14)}
.tk{display:flex;flex-direction:column;gap:2px;background:var(--card);padding:7px 9px;border-radius:7px;margin-bottom:4px;border-left:3px solid #555}
.tk.in-progress{border-color:var(--ok)}.tk.queued{border-color:var(--warn)}.tk.blocked{border-color:var(--bad)}.tk.done{border-color:#3b3b45;opacity:.72}
.tk-n{font-size:12px;color:#b4b4be}
.tk small{font-size:11px;color:var(--faint)}
details.done-list summary{cursor:pointer;color:var(--dim);font-size:12px;padding:6px 2px;min-height:30px}
.empty{display:flex;flex-direction:column;align-items:flex-start;gap:6px;background:var(--card);border-radius:8px;padding:12px}
.empty span{color:var(--dim);font-size:12px}
.empty .btn{margin-top:4px}
.none{color:var(--faint);font-size:12px;padding:4px 2px}
.lg{display:grid;grid-template-columns:auto auto minmax(0,1fr);gap:7px;align-items:baseline;font-size:12px;padding:4px 0;border-bottom:1px solid #1d1d24}
.lg time{color:var(--faint);white-space:nowrap}
.lg i{width:7px;height:7px;border-radius:2px;align-self:center}
.lg i+span{overflow-wrap:anywhere}
.lg span{grid-column:auto;overflow-wrap:anywhere}
.lg time+span{grid-column:2/4}

/* every office at a glance */
dialog#all{width:min(1180px,calc(100vw - 24px));max-width:none;max-height:calc(100dvh - 24px);background:#0e0e13;color:var(--txt);border:1px solid var(--line);border-radius:14px;padding:0;overflow:auto}
dialog#all::backdrop{background:rgba(3,3,6,.72)}
#allhd{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:12px;padding:14px 16px;background:#0e0e13;border-bottom:1px solid var(--line)}
#allhd h2{margin:0;font-size:15px;font-weight:700}
#allhead{color:var(--dim);font-size:12px;flex:1;min-width:0}
#allgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:10px;padding:14px 16px 18px}
.card{display:flex;flex-direction:column;gap:8px;background:var(--card);border:1px solid var(--line);border-top:2px solid var(--a);border-radius:10px;padding:12px}
.card.here{background:var(--card2)}
.card header{display:flex;justify-content:space-between;align-items:center;gap:8px}
.card h3{margin:0;font-size:14px;font-weight:700}
.card-f{margin:0;font-size:12px;color:var(--dim);min-height:34px}
.card dl{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin:0}
.card dl div{background:#101015;border-radius:6px;padding:5px 6px}
.card dt{font-size:10px;color:var(--faint)}
.card dd{margin:0;font-size:14px;font-weight:700}
.card small{font-size:11px;color:var(--faint)}
.card-a{display:flex;gap:6px;margin-top:auto;flex-wrap:wrap}
.card .btn.pri{background:var(--a);border-color:var(--a)}

@media (max-width:860px){
  body{height:auto;min-height:100dvh;overflow:auto}
  #bar{position:sticky;top:0}
  #main{display:block}
  #stage{padding:8px}
  #view{flex:none;height:min(62vh,96vw);touch-action:pan-y}
  #side{border-left:0;border-top:1px solid var(--line);overflow:visible;padding-bottom:calc(16px + env(safe-area-inset-bottom))}
  #focus{white-space:normal}
  #hud{font-size:12px}
  .bb{max-width:40vw;padding:4px 7px;font-size:12px}
  .nt{padding:1px 6px;font-size:12px}
  #snd span{display:none}
  #allbtn span.lbl{display:none}
  .btn{min-height:40px}
  #hint{display:none}
  #hd{gap:8px}
  #acts{width:100%}
  #acts .btn{flex:1 1 0}
  .conn{width:100%}
}
@media (prefers-reduced-motion:reduce){
  #tick span{animation:none;padding-left:12px}
  *{transition:none!important}
}
</style>
</head>
<body>
<header id="bar">
  <button id="allbtn" type="button" title="See every office at a glance" aria-haspopup="dialog">
    <img src="brand/e-globe-av.webp" alt="" width="28" height="28"><span class="lbl">All offices</span><span id="allcount" hidden></span>
  </button>
  <nav id="sw" aria-label="Offices"></nav>
  <button id="snd" type="button" aria-pressed="false" aria-label="Sound" title="EXPIRE MUSIC">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18V6l10-2v12"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="16.5" cy="16" r="2.5"/></svg><span id="sndl">Sound</span>
  </button>
</header>

<main id="main">
  <section id="stage">
    <div id="hd">
      <div id="hd-t">
        <h1><span id="oname"></span><a id="odomain"></a></h1>
        <p id="focus"></p>
      </div>
      <div id="acts">
        <span id="conn" class="conn">connecting</span>
        <span id="nochat">chat not linked yet</span>
        <a id="chat" class="btn pri" target="_blank" rel="noopener" hidden>Open chat</a>
        <a id="site" class="btn" target="_blank" rel="noopener"></a>
      </div>
    </div>
    <div id="view">
      <div id="ov"></div>
      <div id="hud">loading…</div>
      <button id="cls" type="button" hidden>Back to office</button>
      <div id="hint">tap a bot for a close-up</div>
      <div id="no3d" hidden>The 3D office can't run on this device. Everything on the panel is still live.</div>
      <div id="tick"><span>loading…</span></div>
    </div>
  </section>
  <aside id="side">
    <section class="sec"><h2>Team</h2><div id="team"></div></section>
    <section class="sec"><h2>Tasks <small id="taskcount"></small></h2><div id="tasks"></div></section>
    <section class="sec"><h2>Activity</h2><div id="log"></div></section>
  </aside>
</main>

<dialog id="all" aria-labelledby="allttl">
  <div id="allhd">
    <h2 id="allttl">All offices</h2>
    <span id="allhead"></span>
    <button id="allclose" class="btn" type="button">Close</button>
  </div>
  <div id="allgrid"></div>
</dialog>

<script type="module" src="%%ENTRY%%"></script>
</body>
</html>
