<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>expire gta loading bg</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;width:100%;overflow:hidden;background:#05070c;pointer-events:none}
.wrap{position:fixed;inset:0;overflow:hidden}
.photo{
  position:absolute;inset:-2%;
  width:104%;height:104%;
  object-fit:cover;object-position:center 42%;
  transform:scale(1);
  transform-origin:50% 45%;
  animation:ken 40s ease-in-out infinite alternate;
  will-change:transform;
}
@keyframes ken{
  from{transform:scale(1)}
  to{transform:scale(1.04)}
}
.tint{
  position:absolute;inset:0;
  background:
    linear-gradient(180deg,rgba(4,10,22,.42) 0%,rgba(4,10,22,.18) 38%,rgba(2,6,14,.55) 100%),
    radial-gradient(ellipse at 50% 40%,rgba(40,90,160,.12) 0%,transparent 55%);
  pointer-events:none;
}
.vignette{
  position:absolute;inset:0;
  background:radial-gradient(ellipse at 50% 48%,transparent 32%,rgba(0,0,0,.58) 100%);
  pointer-events:none;
}
.stars{
  position:absolute;inset:0;
  background-image:
    radial-gradient(1px 1px at 12% 18%,rgba(255,255,255,.55),transparent),
    radial-gradient(1px 1px at 28% 8%,rgba(220,235,255,.4),transparent),
    radial-gradient(1.5px 1.5px at 72% 14%,rgba(255,255,255,.5),transparent),
    radial-gradient(1px 1px at 88% 22%,rgba(200,220,255,.35),transparent),
    radial-gradient(1px 1px at 64% 6%,rgba(255,255,255,.45),transparent),
    radial-gradient(1px 1px at 42% 12%,rgba(180,210,255,.3),transparent),
    radial-gradient(1.2px 1.2px at 8% 40%,rgba(255,255,255,.25),transparent),
    radial-gradient(1px 1px at 93% 48%,rgba(220,230,255,.3),transparent);
  opacity:.55;
  mix-blend-mode:screen;
  pointer-events:none;
  animation:twinkle 8s ease-in-out infinite alternate;
}
@keyframes twinkle{from{opacity:.4}to{opacity:.65}}
@media (prefers-reduced-motion:reduce){
  .photo{animation:none}
  .stars{animation:none}
}
</style>
</head>
<body aria-hidden="true">
<div class="wrap">
  <img class="photo" src="assets/expire-gta-loading-bg.jpg" alt="" draggable="false"/>
  <div class="tint"></div>
  <div class="stars"></div>
  <div class="vignette"></div>
</div>
</body>
</html>
